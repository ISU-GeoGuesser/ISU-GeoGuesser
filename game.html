<!DOCTYPE html> 

<html lang = "en"> 

<head>


    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReggieGuessr</title>

    <link rel="stylesheet" href="game.css">


</head>

<body>

    <!--campus image-->
    <img src="isuTestPhoto.jpg" alt="campus location" class="roundPhoto">
    
    <div class="darkOverlay"></div>

    <header class="topBar">

        <h2>
            <span class="whiteText">Reggie</span>
            <span class="redText">Guessr</span>
        </h2>

        <nav>
            <a href="#">home</a>
            <a href="#">leaderboard</a>
            <a href="#">sign in</a>
        </nav>

    </header>

    <section class="gameInfo">

        <div class="infoBox">
            <p>Round</p>
            <h1>1/5</h1>
        </div>

        <div class="infoBox">
            <p>Timer</p>
            <h1>60</h1>
        </div>

        <div class="infoBox">
            <p>Score</p>
            <h1>0</h1>
        </div>

    </section>

    <section class="mapScreen">

        <p class="mapTitle">Place Your Guess!</p>

        <div id="map">
            <p>interactive map spot</p>
        </div>

        <a href="#" class="submitButton">
            Submit Guess
        </a>

    </section>

</body>
</html>
