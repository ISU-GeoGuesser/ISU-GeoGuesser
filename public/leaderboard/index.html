<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ReggieGuessr - LeaderBoard</title>
</head>

<body>

    <div class="card">

        <!-- ISU mark: inline so the page needs no extra asset -->
        <svg class="isuLogo" width="72" height="72" viewBox="0 0 100 100" role="img" aria-label="Illinois State University">
            <circle cx="50" cy="50" r="46" fill="#ce0e2d" />
            <circle cx="50" cy="50" r="46" fill="none" stroke="white" stroke-width="3" />
            <text x="50" y="62" text-anchor="middle" fill="white"
                  font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="900"
                  letter-spacing="1">ISU</text>
        </svg>

        <p class="smallTitle">
            ISU Geo Guessr
        </p>

        <h1>
            <span class="whiteText">Leader</span><span class="redText">Board</span>
        </h1>

        <table class="leader-board-table">
            <!-- Labels -->
            <tr>
                <th scope="col">Player Name</th>
                <th scope="col">Highest Score</th>
            </tr>
            <!-- player names pulled from db go underneath -->
        </table>

        <div class="buttons">
            <a href="/home" class="outlineButton">← Home</a>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
